name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop & recreate platform files
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.majorapp --project-name major_express_app

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows App
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MajorExpress_Windows.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MajorExpress_Windows
          path: MajorExpress_Windows.zip
